<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>LuaForge · GTPS Lua Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cff'/%3E%3Cpath d='M20.5 8.5a8.5 8.5 0 1 0 3 11.7 7 7 0 0 1-3-11.7z' fill='%23fff'/%3E%3Ccircle cx='23.5' cy='9' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--panel:#0e111a;--panel2:#141824;--panel3:#1a1f2e;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#e8eaf3;--muted:#8b91a8;--dim:#5b6178;
  --a1:#7c6cff;--a2:#22d3ee;--a3:#f472b6;--good:#34d399;--warn:#fbbf24;--bad:#f87171;
  --grad:linear-gradient(135deg,#7c6cff 0%,#4f8cff 52%,#22d3ee 100%);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --side:292px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--text);background:
  radial-gradient(900px 520px at 12% -12%,rgba(124,108,255,.20),transparent 60%),
  radial-gradient(800px 520px at 100% -5%,rgba(34,211,238,.11),transparent 55%),
  radial-gradient(700px 500px at 60% 120%,rgba(244,114,182,.07),transparent 60%),var(--bg);
  background-attachment:fixed;font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
.ic{flex:none;display:block}
::selection{background:rgba(124,108,255,.4)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box;border:2px solid transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr) 0;height:100dvh;transition:grid-template-columns .32s cubic-bezier(.2,.8,.2,1)}
.app.viewer-open{grid-template-columns:var(--side) minmax(0,1fr) min(580px,44vw)}
.sidebar{display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(14,17,26,.92),rgba(10,12,19,.92));border-right:1px solid var(--line);backdrop-filter:blur(18px);min-height:0;z-index:30}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.viewer{min-width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:25}
.app:not(.viewer-open) .viewer{border-left:0}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 12px}
.logo{width:36px;height:36px;border-radius:11px;flex:none;box-shadow:0 8px 24px -6px rgba(124,108,255,.7)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.01em;margin-top:2px}
.new-btn{margin:6px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:13px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;box-shadow:0 10px 28px -10px rgba(99,102,241,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .15s}
.new-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.new-btn:active{transform:translateY(0)}
.search{margin:0 14px 8px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);font:inherit;font-size:13.5px;outline:none;transition:.15s}
.search input:focus{border-color:rgba(124,108,255,.6);background:rgba(124,108,255,.07)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px 10px;min-height:0}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600;padding:12px 10px 5px}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:11px;cursor:pointer;color:#b6bbd0;font-size:13.8px;position:relative;transition:background .12s,color .12s}
.ci:hover{background:rgba(255,255,255,.05);color:var(--text)}
.ci.active{background:linear-gradient(90deg,rgba(124,108,255,.2),rgba(124,108,255,.06));color:#fff;box-shadow:inset 2px 0 0 var(--a1)}
.ci .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .x{opacity:0;padding:4px;border-radius:7px;color:var(--muted);transition:.12s}
.ci:hover .x,.ci.active .x{opacity:.8}
.ci .x:hover{background:rgba(248,113,113,.16);color:var(--bad);opacity:1}
.empty-list{padding:26px 14px;text-align:center;color:var(--dim);font-size:13px}
.side-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:10px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.side-foot button:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.04)}
.side-note{width:100%;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;padding:2px 4px 6px}
.side-note i{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;min-height:58px;border-bottom:1px solid transparent;position:relative;z-index:5}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.menu-btn{display:none}
.topbar .title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;color:#dfe2ee}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.ok .dot{background:var(--good);box-shadow:0 0 9px var(--good)}
.pill.bad{color:#fecaca;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.pill.bad .dot{background:var(--bad);box-shadow:0 0 9px var(--bad)}
.pill b{color:var(--text);font-weight:600}

/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth}
.chat.no-smooth{scroll-behavior:auto}
.inner{max-width:830px;margin:0 auto;padding:10px 22px 30px}
.msg{display:flex;gap:14px;margin:22px 0;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-user{justify-content:flex-end}
.u-wrap{max-width:86%;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.u-bubble{background:linear-gradient(135deg,rgba(124,108,255,.22),rgba(79,140,255,.16));border:1px solid rgba(124,108,255,.28);padding:11px 16px;border-radius:19px 19px 6px 19px;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 30px -14px rgba(99,102,241,.6)}
.u-files{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.ai-av{width:32px;height:32px;border-radius:10px;flex:none;margin-top:2px}
.ai-body{flex:1;min-width:0}
.ai-name{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.ai-name .tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:rgba(124,108,255,.16);color:#c4bcff}

/* markdown */
.md{word-break:break-word}
.md>*+*{margin-top:.8em}
.md h2,.md h3,.md h4,.md h5{font-weight:650;letter-spacing:-.01em;line-height:1.3;margin-top:1.2em}
.md h2{font-size:1.2em}.md h3{font-size:1.1em}.md h4,.md h5{font-size:1em}
.md ul,.md ol{padding-left:1.35em}.md li{margin:.28em 0}.md li::marker{color:var(--a1)}
.md a{color:#8fb4ff;text-decoration:none;border-bottom:1px solid rgba(143,180,255,.35)}
.md blockquote{border-left:3px solid var(--a1);padding:.2em 1em;color:#b9bed2;background:rgba(124,108,255,.06);border-radius:0 10px 10px 0}
.md hr{border:0;border-top:1px solid var(--line2)}
.md code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.08);padding:.14em .42em;border-radius:6px;color:#f1c9ff}
.md table{border-collapse:collapse;width:100%;font-size:.93em;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line2);padding:7px 11px;text-align:left}.md th{background:rgba(255,255,255,.05)}
.cb{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0c13}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
.cb-h button{display:flex;gap:6px;align-items:center;padding:3px 8px;border-radius:7px;color:var(--muted)}.cb-h button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.cb pre{padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;tab-size:2}
.cb code{background:none;padding:0;color:inherit;font-size:inherit}
.t-c{color:#5f6b86;font-style:italic}.t-s{color:#9ece6a}.t-n{color:#ff9e64}.t-k{color:#bb9af7}.t-f{color:#7dcfff}.t-t{color:#e0af68}.t-l{color:#ff9e64}.t-p{color:#8e9bbd}

/* thought panel */
.th{margin-bottom:12px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));overflow:hidden}
.th-h{width:100%;display:flex;align-items:center;gap:10px;padding:10px 13px;text-align:left;color:var(--muted);font-size:13.5px;transition:background .15s}
.th-h:hover{background:rgba(255,255,255,.035)}
.th-h .th-t{font-weight:600;color:#cfd3e6;white-space:nowrap}
.th-h .th-g{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--dim)}
.th-h .chev{transition:transform .25s}
.th.open .th-h .chev{transform:rotate(180deg)}
.th-b{display:none;padding:2px 14px 14px 14px}
.th.open .th-b{display:block;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tl{position:relative;margin-left:5px}
.st{position:relative;display:flex;gap:13px;padding:5px 0 9px}
.st::before{content:"";position:absolute;left:8px;top:24px;bottom:-4px;width:1px;background:var(--line2)}
.st:last-child::before{display:none}
.st-i{width:17px;height:17px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:2px;background:var(--panel3);border:1px solid var(--line2);color:var(--good)}
.st-run .st-i{border-color:transparent;background:conic-gradient(from 0deg,var(--a1),var(--a2),transparent 70%);animation:spin 1s linear infinite;position:relative}
.st-run .st-i::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--panel)}
.st-err .st-i{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.st-l{font-size:13.5px;font-weight:550;color:#d7daea}
.st-run .st-l{color:#fff}
.st-d{margin-top:6px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(124,108,255,.12);border:1px solid rgba(124,108,255,.25);color:#cfc9ff}
.chip b{color:#fff;font-weight:600}
.reason{max-height:190px;overflow-y:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:#8d93aa;padding:10px 12px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-family:var(--sans)}
.run-spin{width:15px;height:15px;border-radius:50%;background:conic-gradient(from 0deg,var(--a1),var(--a2),transparent 70%);animation:spin .9s linear infinite;position:relative;flex:none}
.run-spin::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--panel2)}

/* file card */
.fc{display:flex;align-items:center;gap:13px;padding:12px 14px;margin:12px 0;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,rgba(124,108,255,.09),rgba(34,211,238,.04)),var(--panel2);cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.fc:hover{border-color:rgba(124,108,255,.55);transform:translateY(-1px);box-shadow:0 14px 34px -18px rgba(99,102,241,.85)}
.fc.active{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1)}
.fc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--grad);flex:none;box-shadow:0 8px 20px -8px rgba(99,102,241,.9)}
.fc-ic,.pchip .fi{color:#fff}
.fc-ic svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.fc-m{flex:1;min-width:0}
.fc-n{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:1px}
.fc-act{display:flex;gap:4px;flex:none}
.fc-btn{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;font-size:13px;font-weight:500;color:#cfd3e6;border:1px solid var(--line2);background:rgba(255,255,255,.04);transition:.15s}
.fc-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.fc-btn.pri{background:rgba(124,108,255,.2);border-color:rgba(124,108,255,.45);color:#fff}
.fc-btn.pri:hover{background:rgba(124,108,255,.38)}
.fc.writing::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--a2),var(--a1),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:slide 1.2s linear infinite}
@keyframes slide{from{background-position:-60% 0}to{background-position:160% 0}}
.fc.small{margin:0;padding:8px 11px;gap:10px;border-radius:13px}
.fc.small .fc-ic{width:32px;height:32px;border-radius:9px}
.fc.small .fc-n{font-size:13px;max-width:190px}.fc.small .fc-s{font-size:11.5px}
.dl-all{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:6px 11px;border:1px dashed var(--line2);border-radius:10px;margin:2px 0 6px}
.dl-all:hover{color:var(--text);border-color:var(--a1)}

.acts{display:flex;align-items:center;gap:4px;margin-top:10px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.acts button{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;color:var(--muted)}
.acts button:hover{background:rgba(255,255,255,.07);color:var(--text)}
.acts .meta{margin-left:6px}
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-top:8px;border-radius:13px;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.3);color:#fecaca;font-size:14px}
.notice{margin-top:8px;padding:9px 13px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:#fde68a;font-size:13.5px}
.stopped{margin-top:8px;font-size:12.5px;color:var(--dim);font-style:italic}
.typing{display:inline-flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--a1);animation:bob 1.1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s;background:#5b9cff}.typing i:nth-child(3){animation-delay:.3s;background:var(--a2)}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* welcome */
.welcome{max-width:760px;margin:0 auto;padding:7vh 22px 20px;text-align:center}
.welcome .big{width:68px;height:68px;border-radius:21px;margin:0 auto 20px;box-shadow:0 18px 50px -12px rgba(124,108,255,.8);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.welcome h2{font-size:clamp(25px,4.2vw,36px);letter-spacing:-.03em;font-weight:700;line-height:1.15}
.welcome h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:12px auto 28px;max-width:520px}
.sugs{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;text-align:left}
.sug{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.18s;display:flex;gap:12px;align-items:flex-start}
.sug:hover{border-color:rgba(124,108,255,.5);background:rgba(124,108,255,.08);transform:translateY(-2px)}
.sug .e{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(124,108,255,.15);color:#c7c0ff;flex:none}
.sug b{display:block;font-size:14px;font-weight:600}.sug span{font-size:12.8px;color:var(--muted);line-height:1.45;display:block;margin-top:2px}
.banner{margin:14px auto 0;max-width:760px;padding:12px 16px;border-radius:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:13.5px;text-align:left}
.banner code{font-family:var(--mono);background:rgba(0,0,0,.3);padding:1px 6px;border-radius:5px}

/* composer */
.composer-wrap{padding:6px 18px calc(16px + env(safe-area-inset-bottom,0px));position:relative}
.composer-wrap::before{content:"";position:absolute;left:0;right:0;top:-34px;height:34px;background:linear-gradient(transparent,rgba(7,8,13,.85));pointer-events:none}
.composer{max-width:830px;margin:0 auto;border-radius:23px;border:1px solid var(--line2);background:rgba(18,21,32,.88);backdrop-filter:blur(18px);box-shadow:0 20px 60px -24px rgba(0,0,0,.8);transition:border-color .2s,box-shadow .2s;position:relative}
.composer:focus-within{border-color:rgba(124,108,255,.65);box-shadow:0 0 0 4px rgba(124,108,255,.12),0 20px 60px -24px rgba(0,0,0,.8)}
.composer.drag{border-color:var(--a2);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.pend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0}
.pchip{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 7px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:12.5px;animation:rise .25s both}
.pchip .fi{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center}
.pchip b{font-weight:550;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:1.2}
.pchip small{color:var(--muted);font-size:11px;display:block;line-height:1.2}
.pchip button{padding:3px;border-radius:6px;color:var(--muted)}.pchip button:hover{background:rgba(248,113,113,.2);color:var(--bad)}
.composer textarea{display:block;width:100%;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:15px 18px 6px;max-height:210px;min-height:30px;line-height:1.55}
.composer textarea::placeholder{color:var(--dim)}
.c-bar{display:flex;align-items:center;gap:6px;padding:6px 10px 10px}
.c-btn{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:500;transition:.15s;border:1px solid transparent}
.c-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.c-btn.eff{border-color:var(--line);background:rgba(255,255,255,.03)}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:13px}.meter i{width:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:13px}
.meter i.on{background:var(--grad);background:linear-gradient(180deg,var(--a2),var(--a1))}
.send{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 10px 24px -8px rgba(99,102,241,.9);transition:.15s}
.send:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.12)}
.send:disabled{background:var(--panel3);box-shadow:none;color:var(--dim)}
.send.stop{background:rgba(248,113,113,.18);color:#fecaca;box-shadow:none;border:1px solid rgba(248,113,113,.45)}
.hint{max-width:830px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--dim)}
.pop{position:absolute;left:10px;bottom:62px;width:min(340px,calc(100vw - 40px));border-radius:17px;border:1px solid var(--line2);background:rgba(20,24,36,.97);backdrop-filter:blur(22px);box-shadow:0 26px 70px -20px rgba(0,0,0,.9);padding:7px;display:none;z-index:40;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.pop.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.pop-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600;padding:8px 11px 5px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 11px;border-radius:12px;transition:.12s}
.opt:hover{background:rgba(255,255,255,.06)}
.opt.sel{background:rgba(124,108,255,.15)}
.opt .meter{height:15px}
.opt-t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.opt-t em{font-style:normal;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:rgba(34,211,238,.14);color:#7ee8fa}
.opt-d{font-size:12.3px;color:var(--muted);line-height:1.4;margin-top:1px}
.opt .ck{margin-left:auto;color:var(--a2);opacity:0}.opt.sel .ck{opacity:1}

.to-bottom{position:absolute;right:22px;bottom:128px;width:38px;height:38px;border-radius:50%;display:none;place-items:center;background:var(--panel3);border:1px solid var(--line2);color:var(--text);box-shadow:0 10px 30px -10px #000;z-index:6}
.to-bottom.show{display:grid}

/* viewer */
.v-h{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:62px}
.v-h .fc-ic{width:36px;height:36px;border-radius:10px}
.v-t{flex:1;min-width:0}.v-t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v-t small{color:var(--muted);font-size:12px}
.v-b{flex:1;overflow:auto;background:#090b12;min-height:0}
.code{display:flex;min-width:max-content;font-family:var(--mono);font-size:13px;line-height:1.7;padding:14px 0 40px}
.code .ln{padding:0 14px 0 16px;text-align:right;color:#444b63;user-select:none;position:sticky;left:0;background:#090b12;white-space:pre;border-right:1px solid var(--line)}
.code pre{padding:0 22px 0 16px;white-space:pre;tab-size:2;flex:1}
.v-wr{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;color:var(--a2);border-top:1px solid var(--line);background:rgba(34,211,238,.05)}

/* misc */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:28;opacity:0;transition:opacity .25s;pointer-events:none}
.drop{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(7,8,13,.82);backdrop-filter:blur(6px)}
.drop.show{display:grid}
.drop div{padding:44px 60px;border:2px dashed var(--a2);border-radius:26px;text-align:center;color:#a5f3fc;font-weight:600;font-size:18px}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none;width:max-content;max-width:calc(100vw - 30px)}
.toast{padding:11px 17px;border-radius:13px;background:rgba(24,28,42,.96);border:1px solid var(--line2);box-shadow:0 18px 50px -14px #000;font-size:13.8px;animation:rise .25s both}
.toast.err{border-color:rgba(248,113,113,.5);color:#fecaca}

@media (max-width:1180px){
  .app.viewer-open{grid-template-columns:var(--side) minmax(0,1fr) 0}
  .viewer{position:fixed;inset:0 0 0 auto;width:min(720px,100%);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px -20px #000;border-left:1px solid var(--line2)!important}
  .app.viewer-open .viewer{transform:none}
}
@media (max-width:860px){
  .app,.app.viewer-open{grid-template-columns:minmax(0,1fr) 0}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:30px 0 80px -20px #000}
  .app.side-open .sidebar{transform:none}
  .app.side-open ~ .scrim{display:block;opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .sugs{grid-template-columns:1fr}
  .topbar{padding:10px 12px}.inner{padding:6px 14px 24px}.composer-wrap{padding-left:10px;padding-right:10px}
  .pill .lbl-long{display:none}
  .fc{flex-wrap:wrap}.fc-act{width:100%;justify-content:flex-end}
  .msg{gap:10px}.ai-av{width:28px;height:28px}
  .u-wrap{max-width:94%}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
'use strict';
/* =====================================================================
   PURE HELPERS (tanpa DOM) — dites terpisah
   ===================================================================== */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtBytes = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
const countLines = (s) => (s ? s.split('\n').length - (s.endsWith('\n') ? 1 : 0) : 0);

/* ---- Lua highlighter ---- */
const LUA_KW = new Set('and break do else elseif end for function goto if in local not or repeat return then until while'.split(' '));
const LUA_LIT = new Set(['nil', 'true', 'false']);
const LUA_RE = /(--\[(=*)\[[\s\S]*?\]\2\]|--[^\n]*)|("(?:\\[\s\S]|[^"\\\n])*"?|'(?:\\[\s\S]|[^'\\\n])*'?|\[(=*)\[[\s\S]*?\]\4\])|(\b0[xX][0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([+\-*\/%^#=<>~.:,;(){}\[\]]+)/g;
function hlLua(src) {
  let out = '', last = 0, m;
  LUA_RE.lastIndex = 0;
  const span = (cls, t) => '<span class="t-' + cls + '">' + esc(t) + '</span>';
  while ((m = LUA_RE.exec(src))) {
    if (m.index > last) out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1] !== undefined) out += span('c', t);
    else if (m[3] !== undefined) out += span('s', t);
    else if (m[5] !== undefined) out += span('n', t);
    else if (m[6] !== undefined) {
      if (LUA_KW.has(t)) out += span('k', t);
      else if (LUA_LIT.has(t)) out += span('l', t);
      else {
        let j = LUA_RE.lastIndex; while (src[j] === ' ' || src[j] === '\t') j++;
        const nx = src[j];
        if (nx === '(' || nx === '"' || nx === "'" || nx === '{') out += span('f', t);
        else if (/^[A-Z][A-Za-z0-9]*$/.test(t) && (nx === ':' || nx === '.')) out += span('t', t);
        else out += esc(t);
      }
    } else if (m[7] !== undefined) out += span('p', t);
    else out += esc(t);
    last = LUA_RE.lastIndex;
    if (m[0].length === 0) LUA_RE.lastIndex++;
  }
  return out + esc(src.slice(last));
}

/* ---- Markdown mini ---- */
function inline(s) {
  const codes = [];
  s = String(s).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
}
function codeBlock(code, lang) {

function buildContext({ query = '', attachments = '', limit = 25, maxChars = 26000 }) {
  const q = String(query);

  const add = (t, w) => { t = stem(t); if (t.length > 1 && !STOP.has(t)) weights.set(t, Math.max(weights.get(t) || 0, w)); };
  for (const raw of rawTokens) {
    tokens(raw).forEach((t) => add(t, 1));
    for (const part of tokens(raw.replace(/_/g, ' '))) add(part, 1);
    (SYN[raw] || []).forEach((s) => add(s, 0.75));
  }
  const ids = identifiers(q);
  const attIds = attachments ? identifiers(attachments) : new Set();
  const sectionHits = new Set(rawTokens.map((t) => SECTION_WORDS.get(t)).filter(Boolean));

  const scored = INDEX.map((x, i) => {
    let sc = 0;
    for (const [t, w] of weights) {
      const k = idf(t);
      if (x.name.has(t)) sc += w * k * 3;
      if (x.desc.has(t)) sc += w * k * 1.2;
      if (x.par.has(t)) sc += w * k * 0.6;
    }
    if (ids.has(x.method) && x.method.length > 3) sc += 25;
    if (ids.has(x.full)) sc += 25;
    if (attIds.has(x.method) && x.method.length > 4) sc += 9;
    if (sectionHits.has(x.e.s)) sc += 1.5;
    sc *= nichePenalty(x.e.s, q);
    return { i, sc };
  }).filter((r) => r.sc > 0).sort((a, b) => b.sc - a.sc);

  const chosen = new Set();
  for (const [re, names] of PINS) {
    if (!re.test(q)) continue;
    INDEX.forEach((x, i) => { if (names.some((n) => x.e.n === n || x.e.n.startsWith(n + '(') || x.e.n.startsWith(n))) chosen.add(i); });
  }
  const pinned = chosen.size;
  for (const r of scored) { if (chosen.size >= limit + Math.min(pinned, 8)) break; chosen.add(r.i); }

  // Kelompokkan per section agar mudah dibaca model
  const bySection = new Map();
  let chars = 0;
  for (const i of [...chosen].sort((a, b) => a - b)) {
    const e = ENTRIES[i];
    const line = fmt(e);
    if (chars + line.length > maxChars) continue;
    chars += line.length;
    if (!bySection.has(e.s)) bySection.set(e.s, []);

  return { text, meta: { total: groups.reduce((a, g) => a + g[1], 0), groups, names, pinned } };
}

function download(name, text, type) {
  const blob = text instanceof Blob ? text : new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyText(t, okMsg) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = 0; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch { /* */ } ta.remove(); }
  toast(okMsg || 'Disalin ✓');
}

/* =====================================================================
   SENDING & STREAMING
   ===================================================================== */
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 210) + 'px'; }
function focusInput() { if (innerWidth > 860) $('#input').focus(); }

function send(textArg) {
  if (S.streaming) return;
  const text = (textArg !== undefined ? textArg : $('#input').value).trim();
  if (!text && !S.pending.length) return;
  let chat = active();
  if (!chat) { chat = { id: uid(), title: 'Chat baru', created: Date.now(), updated: Date.now(), messages: [] }; S.chats.unshift(chat); S.activeId = chat.id; }
  if (!chat.messages.length) chat.title = (text || (S.pending[0] && S.pending[0].name) || 'Chat baru').replace(/\s+/g, ' ').slice(0, 46);
  chat.messages.push({ id: uid(), role: 'user', content: text, files: S.pending.map((f) => ({ name: f.name, text: f.text, size: f.size })), ts: Date.now() });
  S.pending = []; $('#input').value = ''; autosize();
  const am = newAssistantMsg(); chat.messages.push(am); chat.updated = Date.now();
  save(true); renderAll(); run(chat, am);
}
const newAssistantMsg = () => ({ id: uid(), role: 'assistant', content: '', reasoning: '', steps: [], status: 'streaming', effort: S.effort, t0: Date.now(), ts: Date.now() });

function regenerate() {
  const c = active(); if (!c || S.streaming) return;
  while (c.messages.length && c.messages[c.messages.length - 1].role === 'assistant') c.messages.pop();
  if (!c.messages.length) return;
  const am = newAssistantMsg(); c.messages.push(am); save(true); renderAll(); run(c, am);
}

function upsertStep(am, s) {
  const cur = am.steps.find((x) => x.id === s.id);
  if (cur) Object.assign(cur, s); else am.steps.push({ ...s });
}
function syncFileSteps(am) {
  const files = parseContent(am.content).filter((p) => p.type === 'file');
  files.forEach((f, i) => {
    const id = 'file-' + i; const cur = am.steps.find((s) => s.id === id);
    const st = f.done ? 'done' : 'running'; const label = (f.done ? 'Wrote ' : 'Writing ') + f.name;
    if (cur) { cur.status = st; cur.label = label; } else am.steps.push({ id, label, status: st });
  });
}
function onEvent(am, ev) {
  switch (ev.type) {
    case 'step': {
      const { type, ...s } = ev; upsertStep(am, s);
      if (ev.id === 'thought' && ev.status === 'done' && !am.thoughtMs) am.thoughtMs = Date.now() - am.t0;
      if (ev.id === 'thought' && ev.status === 'done' && !thoughtOpen.has(am.id)) { /* biarkan terbuka sampai selesai */ }
      break;
    }
    case 'reasoning': if (am.reasoning.length < 40000) am.reasoning += ev.text; break;
    case 'content': am.content += ev.text; syncFileSteps(am); break;
    case 'notice': am.notice = ev.message; break;
    case 'done': am.usage = ev.usage; am.ms = ev.ms; break;
    case 'error': am.status = 'error'; am.error = ev.message; break;
  }
}

/** Panggil /api/chat (proxy Groq) dan baca event SSE-nya. */
async function callChat(body, signal, onEv) {
  const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });
  if (!resp.ok) { let j = null; try { j = await resp.json(); } catch { /* */ } throw new Error((j && j.error) || 'Server error ' + resp.status); }
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = ''; let result = {};
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        if (ev.type === 'error') throw new Error(ev.message);
        if (ev.type === 'done') result = ev; else onEv(ev);
      }
    }
    patchStreaming(); save();
  }
  return result;
}

async function run(chat, am) {
  S.streaming = true; S.abort = new AbortController(); renderComposerState();
  const cfg = EFFORT_CFG[am.effort] || EFFORT_CFG.medium; const signal = S.abort.signal;
  const raw = chat.messages.slice(0, chat.messages.indexOf(am)).filter((m) => !(m.role === 'assistant' && (m.status === 'error' || !m.content)));
  const timer = setInterval(() => { if (am.status === 'streaming' && !am.thoughtMs) patchStreaming(); }, 1000);
  const addUsage = (a, b) => (!a ? b : !b ? a : { prompt_tokens: (a.prompt_tokens || 0) + (b.prompt_tokens || 0), completion_tokens: (a.completion_tokens || 0) + (b.completion_tokens || 0), total_tokens: (a.total_tokens || 0) + (b.total_tokens || 0) });
  try {
    // 1) Thought Process + 2) Read Skill Docs
    upsertStep(am, { id: 'thought', label: 'Thought Process', status: 'running' }); patchStreaming(true);
    const users = raw.filter((m) => m.role === 'user'); const last = users[users.length - 1];
    let query = String(last.content || '');
    if (query.length < 80 && users.length > 1) query = String(users[users.length - 2].content || '') + ' ' + query;
    const attachments = (last.files || []).map((f) => String(f.text || '').slice(0, FILE_CHARS)).join('\n');
    const ctx = buildContext({ query, attachments, limit: cfg.docs });
    upsertStep(am, { id: 'docs', label: 'Read Skill Docs', status: 'done', detail: ctx.meta });
    const history = trimHistory(raw.map((m) => ({ role: m.role, content: m.role === 'user' ? withFiles(m) : m.content })).filter((m) => m.content));
    const base = [{ role: 'system', content: buildSystemPrompt({ docsText: ctx.text, verify: cfg.verify }) }, ...history];

    const closeThought = () => { const s = am.steps.find((x) => x.id === 'thought'); if (s && s.status === 'running') { s.status = 'done'; if (!am.thoughtMs) am.thoughtMs = Date.now() - am.t0; } };
    const final = cfg.passes === 1; let draft = '', draftStarted = false;
    const r1 = await callChat({ messages: base, reasoning: cfg.reasoning, maxTokens: cfg.maxTokens }, signal, (ev) => {
      if (ev.type === 'reasoning') onEvent(am, ev);
      else if (ev.type === 'content') {
        closeThought();
        if (final) onEvent(am, ev);
        else { draft += ev.text; if (!draftStarted) { draftStarted = true; upsertStep(am, { id: 'draft', label: 'Drafting script', status: 'running' }); } }
      }
    });
    closeThought();
    let usage = r1.usage, finish = r1.finish;

    // Max: review draft terhadap dokumentasi
    if (!final) {
      upsertStep(am, { id: 'draft', label: 'Drafting script', status: 'done' });
      upsertStep(am, { id: 'review', label: 'Review & Verify against docs', status: 'running' });
      am.reasoning += '\n\n— Review —\n\n';
      const reviewMsgs = [...base, { role: 'assistant', content: draft }, { role: 'user', content: 'Review your draft above strictly against the documentation. Check: (1) every method/callback/global exists with the exact signature, (2) argument order and return types, (3) nil handling and permission checks, (4) logic bugs and edge cases. Then output the FINAL corrected answer in the same format (complete files inside <gtps-file name="...">). Output only the final answer, do not mention the review.' }];
      let reviewClosed = false;
      const closeReview = () => { if (!reviewClosed) { reviewClosed = true; upsertStep(am, { id: 'review', label: 'Review & Verify against docs', status: 'done' }); } };
      const r2 = await callChat({ messages: reviewMsgs, reasoning: cfg.reasoning, maxTokens: cfg.maxTokens }, signal, (ev) => {
        if (ev.type === 'reasoning') onEvent(am, ev);
        else if (ev.type === 'content') { closeReview(); onEvent(am, ev); }
      });
      closeReview(); finish = r2.finish; usage = addUsage(usage, r2.usage);
    }
    if (finish === 'length') am.notice = 'Output terpotong karena batas token. Ketik "lanjutkan" atau naikkan effort.';
    am.usage = usage; am.ms = Date.now() - am.t0;
    if (am.status === 'streaming') am.status = 'done';
    if (!am.content) { am.status = 'error'; am.error = 'Model tidak mengembalikan jawaban. Coba ulangi atau turunkan effort.'; }
  } catch (e) {
    if (e.name === 'AbortError') am.status = 'stopped'; else { am.status = 'error'; am.error = (e.message === 'Failed to fetch' ? 'Tidak bisa terhubung ke server.' : e.message); }
  } finally {
    clearInterval(timer); S.streaming = false; S.abort = null;
    const bad = am.status === 'error' || am.status === 'stopped';
    am.steps.forEach((s) => { if (s.status === 'running') s.status = bad ? (am.status === 'error' ? 'error' : 'stopped') : 'done'; });
    if (!am.thoughtMs) am.thoughtMs = Date.now() - am.t0;
    chat.updated = Date.now(); thoughtOpen.delete(am.id);
    save(true); renderSidebar(); renderMessages(true); renderComposerState(); renderViewer();
    if (active() === chat) { const el = $('#chat'); if (el.scrollHeight - el.scrollTop - el.clientHeight < 400) el.scrollTop = el.scrollHeight; }
  }
}
function stop() { if (S.abort) S.abort.abort(); }

/* =====================================================================
   ATTACHMENTS
   ===================================================================== */
const BINARY_EXT = /\.(docx?|pdf|png|jpe?g|gif|webp|bmp|zip|rar|7z|tar|gz|exe|dll|bin|xlsx?|pptx?|mp[34]|wav)$/i;
async function addFiles(list) {
  for (const f of Array.from(list)) {
    if (S.pending.length >= 6) { toast('Maksimal 6 file per pesan.', true); break; }
    if (BINARY_EXT.test(f.name)) { toast(f.name + ': hanya file teks (.lua, .txt, .json, …). Salin isinya ke file .txt dulu.', true); continue; }
    if (f.size > 300 * 1024) { toast(f.name + ' terlalu besar (maks 300 KB).', true); continue; }
    let text; try { text = await f.text(); } catch { toast('Gagal membaca ' + f.name, true); continue; }
    if (text.includes('\u0000')) { toast(f.name + ' bukan file teks.', true); continue; }
    S.pending.push({ id: uid(), name: f.name, text, size: f.size });
  }
  renderPending(); renderComposerState();
}

/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
function exportAll() {
  if (!S.chats.length) return toast('Belum ada chat untuk di-export.');
  download('luaforge-chats-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'luaforge', v: 1, chats: S.chats }, null, 1), 'application/json');
}
async function importChats(file) {
  try {
    const j = JSON.parse(await file.text()); const arr = Array.isArray(j) ? j : j.chats;
    if (!Array.isArray(arr)) throw 0;
    let n = 0; for (const c of arr) { if (c && c.id && Array.isArray(c.messages) && !S.chats.find((x) => x.id === c.id)) { S.chats.push(c); n++; } }
    save(true); renderAll(); toast(n + ' chat diimpor.');
  } catch { toast('File import tidak valid.', true); }
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const closeSide = () => $('#app').classList.remove('side-open');
document.addEventListener('click', (e) => {
  const pop = $('#effPop');
  if (!e.target.closest('#effPop') && !e.target.closest('#effBtn')) pop.classList.remove('show');
  const t = e.target.closest('[data-act],[data-eff],.ci');
  if (!t) return;
  if (t.dataset.eff) { S.effort = t.dataset.eff; renderEffort(); pop.classList.remove('show'); save(true); return; }
  const act = t.dataset.act;
  if (!act && t.classList.contains('ci')) return openChat(t.dataset.id);
  const msgEl = t.closest('.msg'); const m = msgEl ? findMsg(msgEl.dataset.id) : null;
  const fcEl = t.closest('.fc');
  switch (act) {
    case 'del-chat': e.stopPropagation(); return deleteChat(t.closest('.ci').dataset.id);
    case 'view': if (fcEl && !e.target.closest('.fc-btn:not(.pri)')) return openViewer(fcEl.dataset.key); break;
    case 'dl': { const f = resolveFile(fcEl.dataset.key); if (f) download(safeName(f.name), f.code); return; }
    case 'copy-file': { const f = resolveFile(fcEl.dataset.key); if (f) copyText(f.code, 'Kode disalin ✓'); return; }
    case 'v-close': return closeViewer();
    case 'v-copy': { const f = resolveFile(S.viewerKey); if (f) copyText(f.code, 'Kode disalin ✓'); return; }
    case 'v-dl': { const f = resolveFile(S.viewerKey); if (f) download(safeName(f.name), f.code); return; }
    case 'dl-all': { const fs = parseContent(m.content).filter((p) => p.type === 'file').map((p) => ({ name: safeName(p.name), text: p.code })); download('luaforge-scripts.zip', makeZip(fs)); return; }
    case 'copy-code': return copyText(t.closest('.cb').querySelector('code').textContent, 'Kode disalin ✓');
    case 'copy-msg': { const txt = parseContent(m.content).map((p) => (p.type === 'text' ? p.text.trim() : '```lua\n' + p.code + '```')).join('\n\n'); return copyText(txt, 'Jawaban disalin ✓'); }
    case 'regen': return regenerate();
    case 'toggle-thought': { const th = t.closest('.th'); const mm = findMsg(th.dataset.mid); const cur = th.classList.contains('open'); thoughtOpen.set(mm.id, !cur); th.classList.toggle('open', !cur); fixReasonScroll(); return; }
    case 'rm-pend': S.pending = S.pending.filter((f) => f.id !== t.dataset.id); renderPending(); renderComposerState(); return;
    case 'sug': { const s = SUGS[+t.dataset.i]; if (s.attach) { $('#input').value = s.p; autosize(); renderComposerState(); $('#fileInput').click(); } else send(s.p); return; }
  }
});
$('#newChat').addEventListener('click', newChat);
$('#menuBtn').addEventListener('click', () => $('#app').classList.add('side-open'));
$('#scrim').addEventListener('click', closeSide);
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
$('#effBtn').addEventListener('click', () => $('#effPop').classList.toggle('show'));
$('#sendBtn').addEventListener('click', () => (S.streaming ? stop() : send()));
$('#exportBtn').addEventListener('click', exportAll);
$('#importBtn').addEventListener('click', () => $('#importInput').click());
$('#importInput').addEventListener('change', (e) => { if (e.target.files[0]) importChats(e.target.files[0]); e.target.value = ''; });
$('#clearBtn').addEventListener('click', () => {
  if (S.streaming) return toast('Hentikan respons dulu.');
  if (!S.chats.length) return;
  if (confirm('Hapus SEMUA chat di browser ini? (Export dulu kalau perlu)')) { S.chats = []; S.activeId = null; closeViewer(); save(true); renderAll(); }
});
$('#search').addEventListener('input', (e) => { S.filter = e.target.value; renderSidebar(); });
$('#input').addEventListener('input', () => { autosize(); renderComposerState(); });
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); if (!S.streaming) send(); }
});
$('#input').addEventListener('paste', (e) => { const fs = e.clipboardData && e.clipboardData.files; if (fs && fs.length) { e.preventDefault(); addFiles(fs); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#effPop').classList.remove('show'); if (S.viewerKey) closeViewer(); closeSide(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); }
});
$('#list').addEventListener('dblclick', (e) => {
  const ci = e.target.closest('.ci'); if (!ci) return; const c = S.chats.find((x) => x.id === ci.dataset.id);
  const n = prompt('Ganti nama chat:', c.title); if (n && n.trim()) { c.title = n.trim().slice(0, 80); save(true); renderSidebar(); if (c.id === S.activeId) $('#title').textContent = c.title; }
});
// drag & drop
let dragN = 0; const drop = $('#drop');
addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragN++; drop.classList.add('show'); } });
addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) drop.classList.remove('show'); });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); dragN = 0; drop.classList.remove('show'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
// scroll-to-bottom button
$('#chat').addEventListener('scroll', () => { const c = $('#chat'); $('#toBottom').classList.toggle('show', c.scrollHeight - c.scrollTop - c.clientHeight > 320); }, { passive: true });
$('#toBottom').addEventListener('click', () => { const c = $('#chat'); c.scrollTop = c.scrollHeight; });

/* =====================================================================
   INIT
   ===================================================================== */
function init() {
  loadState();
  $('#newChat').innerHTML = ic('plus', 18) + ' Chat Baru';
  $('#menuBtn').innerHTML = ic('menu', 20);
  $('#attachBtn').innerHTML = ic('clip', 18) + '<span class="lbl-long">Lampirkan</span>';
  $('#toBottom').innerHTML = ic('down', 18);
  $('#searchBox').insertAdjacentHTML('afterbegin', ic('search', 15));
  $('#exportBtn').innerHTML = ic('download', 14) + 'Export';
  $('#importBtn').innerHTML = ic('upload', 14) + 'Import';
  $('#clearBtn').innerHTML = ic('trash', 14) + 'Hapus';
  renderEffort(); renderAll(); autosize();
  focusInput();
}
init();
</script>
